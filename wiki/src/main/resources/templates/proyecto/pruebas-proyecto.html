<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="icon" type="image/png" href="/favicon/unit-testing.png">   
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.2.0/remixicon.css">
    <title>Pruebas del Proyecto</title>
    <style>
        /* Estilos para la flecha */
        .back-arrow {
            position: fixed;
            top: 20px;
            left: 20px;
            font-size: 2em;
            color: #333; /* Color de la flecha */
            text-decoration: none;
            z-index: 10;
        }

        .back-arrow:hover {
            color: #007bff; /* Color al pasar el cursor */
        }
    </style>
</head>
<body>
    <main class="main">
        <a th:href="@{/}" class="back-arrow">
            <i class="ri-arrow-left-s-line"></i>
        </a>

        <section class="deployment-section section" id="deployment">
            <h2 class="section__title">Despliegue del Proyecto</h2>

            <div class="deployment-section__container container">
                <div class="version-card">
                    <h3>v1.1.0</h3>
                    <span class="version-status">Producción</span>
                    <p class="version-date">2025-02-20</p>
                    <ul class="version-description">
                        <li>Despliegue final</li>
                    </ul>
                </div>

                <div class="version-card">
                    <h3>v1.0.0</h3>
                    <span class="version-status">Producción</span>
                    <p class="version-date">2025-02-19</p>
                    <ul class="version-description">
                        <li>Lanzamiento inicial en docker</li>
                    </ul>
                </div>

                <div class="version-card">
                    <h3>v0.3.0</h3>
                    <span class="version-status">Desarrollo</span>
                    <p class="version-date">2025-02-19</p>
                    <ul class="version-description">
                        <li>Estructura y diseño de paginas terminado</li>
                    </ul>
                </div>
            </div>
        </section>        
    </main>

    <footer class="footer">
        <div class="footer__container container grid">
         <div class="footer__content grid">
             <a href="" class="footer__logo">Team Dinamita</a>
         </div>
         <div class="footer__social">
             <a href="https://es-es.facebook.com/juanmartin.sanchezburbano" target="_blank" class="footer__social-link">
                 <i class="ri-facebook-circle-line"></i>
             </a>
 
             <a href="www.instagram.com/_juanm12_" target="_blank" class="footer__social-link">
                 <i class="ri-instagram-line"></i>
             </a>
 
             <a href="https://x.com/palmaaaaaaaax" target="_blank" class="footer__social-link">
                 <i class="ri-twitter-x-line"></i>
             </a>
         </div>
        </div>
        <span class="footer__copy">
         &copy; 2025 Team Dinamita. All right reserved
        </span>
     </footer>
     
    <script>
        window.addEventListener('load', function() {
            const elements = document.querySelectorAll('.version-card');
            elements.forEach(element => {
                element.classList.add('show');
            });
        });
    </script> 
</body>
</html>
